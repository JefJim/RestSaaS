version: '3.8'

services:
  backend:
    build: 
      context: ../../backend
      dockerfile: Dockerfile
    container_name: restsaas_api
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://*:8080
    restart: unless-stopped

  frontend:
    build: 
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: restsaas_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NODE_ENV=development
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: restsaas_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

